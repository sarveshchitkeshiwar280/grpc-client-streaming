name: CI/CD

on:
  workflow_dispatch:      # Allows manual triggering
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./stock-trading-${{ matrix.service }}
          file: ./stock-trading-${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/stock-trading-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/stock-trading-${{ matrix.service }}:latest











































































































































































































