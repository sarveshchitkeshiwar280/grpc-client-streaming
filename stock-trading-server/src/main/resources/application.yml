server:
  port: 8081

spring:
  application:
    name: stock-trading-server

grpc:
  server:
    port: 6565
    enable-reflection: true

logging:
  level:
    root: INFO
    com.javatechie: DEBUG
    org.springframework: INFO
    org.springframework.web: INFO
    io.grpc: INFO
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
