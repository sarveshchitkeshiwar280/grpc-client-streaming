<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Stock Orders | Pro Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --bg-body: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body {
            background: var(--bg-body);
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }

        .container { max-width: 1000px; margin-top: 50px; margin-bottom: 50px; }

        h2 {
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #0f172a;
            margin-bottom: 40px;
        }

        /* Form Styling */
        .order-form {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
        }

        /* Card Decoration */
        .order-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.2s ease;
        }

        .order-card:hover {
            border-color: var(--primary-blue);
            background: #fcfdff;
        }

        .remove-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            padding: 0;
            line-height: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Form Inputs */
        .form-label { font-weight: 600; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            border-color: var(--primary-blue);
        }

        /* Buttons */
        .btn { border-radius: 8px; font-weight: 600; padding: 10px 20px; transition: all 0.2s; }
        .btn-success { background: var(--primary-blue); border: none; }
        .btn-success:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-info { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-info:hover { background: #e2e8f0; color: #1e293b; }

        /* Summary Section */
        .order-summary {
            background: #0f172a;
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-top: 40px;
            box-shadow: var(--card-shadow);
        }

        .order-summary h5 { color: #38bdf8; font-weight: 700; margin-bottom: 20px; }

        .connection-status {
            border-radius: 12px;
            font-weight: 600;
            border: none;
            padding: 15px 20px;
        }

        /* Result Cards (Inner) */
        #result .card {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        #result .text-success { color: #4ade80 !important; }
        #result .text-muted { color: #94a3b8 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 Bulk Stock Terminal</h2>

    <div class="alert alert-info connection-status" id="connectionStatus">
        <span class="spinner-border spinner-border-sm me-2"></span> Initializing system connection...
    </div>

    <form id="orderForm" class="order-form">
        <div id="orders">
        </div>

        <div class="btn-section d-flex justify-content-between align-items-center mt-4">
            <div>
                <button type="button" class="btn btn-info me-2" onclick="addOrder()">➕ Add Order</button>
                <button type="button" class="btn btn-warning" onclick="testConnection()">🔌 Test Link</button>
            </div>
            <button type="submit" class="btn btn-success btn-lg px-5">🚀 Execute Bulk Trade</button>
        </div>
    </form>

    <div class="order-summary">
        <h5>📊 Execution Summary</h5>
        <div id="result">
            <p class="text-muted">Waiting for execution instructions...</p>
        </div>
    </div>
</div>

<script>
    /** * NOTE: Logic remains 100% untouched to ensure backend compatibility.
     * Only small innerHTML adjustments for visual styling of the results.
     **/

    window.onload = function() {
        addOrder();
        testConnection();
    };

    function testConnection() {
        const statusDiv = document.getElementById("connectionStatus");
        fetch("http://localhost:8081/api/health")
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.text();
            })
            .then(health => {
                statusDiv.innerHTML = `✅ System Online: ${health}`;
                statusDiv.className = "alert alert-success connection-status shadow-sm";
            })
            .catch(error => {
                statusDiv.innerHTML = `❌ Connection Error: ${error.message} <br><small>Ensure mvn spring-boot:run is active on 8081</small>`;
                statusDiv.className = "alert alert-danger connection-status shadow-sm";
            });
    }

    function addOrder() {
        const ordersDiv = document.getElementById("orders");
        const orderCount = ordersDiv.children.length + 1;

        const newOrder = document.createElement("div");
        newOrder.className = "order-card";
        newOrder.innerHTML = `
            <button type="button" class="btn btn-sm btn-danger remove-btn" onclick="this.parentElement.remove()">×</button>
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Order ID</label>
                    <input type="text" name="orderId" class="form-control bg-light" value="ORD-${String(orderCount).padStart(3, '0')}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Stock Symbol</label>
                    <select name="stockSymbol" class="form-select" required>
                        <option value="AAPL">AAPL - Apple</option>
                        <option value="GOOGL">GOOGL - Google</option>
                        <option value="MSFT">MSFT - Microsoft</option>
                        <option value="TSLA">TSLA - Tesla</option>
                        <option value="AMZN">AMZN - Amazon</option>
                         <option value="NEFTY">NEFTY - NFCI</option>
                         <option value="SENSEX">SENSEX - ANGELEONE</option>



                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Action</label>
                    <select name="orderType" class="form-select fw-bold" required>
                        <option value="BUY" class="text-success">BUY</option>
                        <option value="SELL" class="text-danger">SELL</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Limit Price ($)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="${175 + orderCount}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" value="${50 + (orderCount * 10)}" required>
                </div>
            </div>
        `;
        ordersDiv.appendChild(newOrder);
    }

    document.getElementById("orderForm").onsubmit = function (event) {
        event.preventDefault();
        const orders = [];
        const orderElements = document.querySelectorAll(".order-card");

        orderElements.forEach((card) => {
            const order = {
                orderId: card.querySelector("[name='orderId']").value,
                stockSymbol: card.querySelector("[name='stockSymbol']").value,
                orderType: card.querySelector("[name='orderType']").value,
                price: parseFloat(card.querySelector("[name='price']").value),
                quantity: parseInt(card.querySelector("[name='quantity']").value),
                userId: "user123",
                portfolioId: "portfolio456",
                timestamp: new Date().toISOString()
            };
            orders.push(order);
        });

        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = `<div class="d-flex align-items-center"><div class="spinner-border text-info me-3"></div> <span>Executing batch trade of ${orders.length} orders...</span></div>`;

        fetch("http://localhost:8081/api/orders/bulk", {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orders)
        })
        .then(response => {
            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            return response.json();
        })
        .then(data => {
            let html = `
                <div class="p-3 border border-secondary rounded mb-3">
                    <div class="row text-center">
                        <div class="col"><strong>Total:</strong> ${data.totalOrders || orders.length}</div>
                        <div class="col text-success"><strong>Success:</strong> ${data.successCount || orders.length}</div>
                        <div class="col text-warning"><strong>Failed:</strong> ${data.failedCount || 0}</div>
                    </div>
                </div>`;

            if (data.orders) {
                data.orders.forEach(order => {
                    const statusClass = order.status === 'SUCCESS' ? 'text-success' : 'text-danger';
                    html += `
                        <div class="card mb-2 p-2" style="background: #1e293b; border: 1px solid #334155;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div><span class="badge bg-primary me-2">${order.symbol || order.stockSymbol}</span> ${order.orderType} ${order.quantity} units</div>
                                <div class="${statusClass} fw-bold">${order.status || 'PROCESSED'}</div>
                            </div>
                        </div>`;
                });
            }
            resultDiv.innerHTML = html;
        })
        .catch(error => {
            resultDiv.innerHTML = `<div class="alert alert-danger mt-3">⚠️ Error: ${error.message}</div>`;
        });
    };

    function testEndpoint() {
        // Keeps original testing function for safety
        testConnection();
    }
</script>
</body>
</html>
